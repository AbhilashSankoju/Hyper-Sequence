<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEQUENCE POWER</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>SEQUENCE POWER</h1>
    <h2>PRESS ANY KEY TO CONTINUE...</h2>
    <br>
    <div class="main-box">
        <div class="row1">
            <div id="red" class="box"></div>
            <div id="yellow" class="box"></div>
        </div>
        <div class="row2">
            <div id="green" class="box"></div>
            <div id="blue" class="box"></div>
        </div>
    </div>
    <div class="score">
        <div class="cscore sc"><h2>Current Score: 0</h2></div>
        <div class="hscore sc"><h2>Highest Score: 0</h2></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
